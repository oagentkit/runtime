# api-lifecycle 定级清单（判据同源 matrix-tools docs/adr/ADR-002 引用的
# yi-nology/goagent-kernel docs/api-compat.md：breaking 四类 / 三级承诺 / 晋级三维）
# 本文件一放，matrix-tools verify_api_lifecycle 全套判定即生效（新增包必须登记）。
version: 1
packages:
  - pkg: pacer
    level: Experimental
    since: v0.14.0
    reason: "流式增量节流器（token 分片攒够窗口再发）；未过一个 minor 无 breaking 窗口（api-compat.md 晋级条件一），初值如实记为不承诺兼容"
  - pkg: progress
    level: Experimental
    since: v0.14.0
    reason: "泛型事件总线 Bus[T]（观测有损广播）；未过一个 minor 无 breaking 窗口（api-compat.md 晋级条件一），初值如实记为不承诺兼容"
  - pkg: procx
    level: Experimental
    since: v0.14.0
    reason: "子进程最小环境构造与执行封装（配 guardx/egressproxy 强制出口）；未过一个 minor 无 breaking 窗口（api-compat.md 晋级条件一），初值如实记为不承诺兼容"
  - pkg: hotplug
    level: Experimental
    since: v0.14.0
    reason: "运行时插拔与原子热替换（Plugboard/Holder 快照持有点）；未过一个 minor 无 breaking 窗口（api-compat.md 晋级条件一），初值如实记为不承诺兼容"
  - pkg: hookx
    level: Experimental
    since: v0.14.0
    reason: "外部 hook 拦截协议（生命周期接口，评审点名）；未过一个 minor 无 breaking 窗口（api-compat.md 晋级条件一），初值如实记为不承诺兼容"
  - pkg: notifyx
    level: Experimental
    since: v0.14.0
    reason: "生命周期事件通知出口（notify sink，归一化事件可靠外发）；未过一个 minor 无 breaking 窗口（api-compat.md 晋级条件一），初值如实记为不承诺兼容"
  - pkg: notifyx/hook
    level: Experimental
    since: v0.14.0
    reason: "挂点侧官方 shim（平台 shell 协议载荷归一化为 notifyx.Payload）；未过一个 minor 无 breaking 窗口（api-compat.md 晋级条件一），初值如实记为不承诺兼容"
